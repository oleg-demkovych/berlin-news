<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Берлін сьогодні</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c8102e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Берлін">
<style>
:root{--bg:#f3f4f8;--card:#fff;--ink:#151726;--mute:#5d6178;--line:#dfe1ea;--acc:#c8102e;--on:#fff;--hot:#d9480f}
:root[data-theme=dark]{--bg:#0f1019;--card:#181a27;--ink:#eceefa;--mute:#9ca0bb;--line:#2b2e42;--acc:#ff6b7d;--on:#12121f;--hot:#ff8a50}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
.wrap{max-width:1180px;margin:auto;padding:0 16px}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:24px 8px}
h1{font-size:2rem;letter-spacing:-.03em;margin-right:auto}h1 span{color:var(--acc)}
button,input,select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 13px}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.meta{color:var(--mute);font-size:.875rem}
.bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
#q{flex:1;min-width:200px}
#cats{flex-wrap:nowrap;overflow-x:auto;padding:10px 2px 2px}
.chip{border-radius:99px;white-space:nowrap;font-size:.875rem}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--on)}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:14px;padding-block:18px}
article{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
article img{width:100%;aspect-ratio:2/1;object-fit:cover;background:var(--line)}
.body{padding:14px 16px;display:flex;flex-direction:column;gap:8px;flex:1;overflow-wrap:anywhere}
h2{font-size:1.08rem;line-height:1.35}h2 a{color:inherit;text-decoration:none}h2 a:hover{color:var(--acc);text-decoration:underline}
.read{opacity:.55}
.new{color:var(--hot);font-weight:700}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.full{color:var(--acc);margin-left:auto}
.star{padding:2px 10px}.star[aria-pressed=true]{color:var(--hot);border-color:var(--hot)}
#more{display:block;margin:0 auto 24px}
#empty{padding:40px 0;text-align:center;grid-column:1/-1}
@media(max-width:640px){.bar{position:static}}
details{padding-block:12px 32px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="wrap">
  <h1>Берлін<span> </span>сьогодні</h1>
  <span class="meta" id="status" role="status">Завантаження…</span>
  <button id="lang" class="chip">Перекласти українською</button>
  <button id="install" hidden>Встановити</button>
  <button id="refresh">Оновити</button>
  <button id="theme" aria-label="Змінити тему">◐</button>
</header>
<div class="bar"><div class="wrap">
  <div class="row">
    <input id="q" type="search" placeholder="Пошук: BVG, Mitte, Miete…" aria-label="Пошук">
    <select id="period" aria-label="Період"><option value="0">За весь час</option><option value="1">За 24 години</option><option value="7">За тиждень</option><option value="30">За місяць</option></select>
    <select id="source" aria-label="Джерело"></select>
  </div>
  <div class="row" id="cats"></div>
</div></div>
<main class="wrap">
  <p class="meta" id="count" style="padding-top:14px"></p>
  <div id="list"></div>
  <button id="more">Показати ще</button>
  <details class="meta"><summary>Стан джерел</summary><div id="health"></div></details>
</main>
<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('berlin:' + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('berlin:' + k, JSON.stringify(v)); } catch {} }
};
const HOUR = 3600e3, PAGE = 36;
let uk = store.get('uk', false);
let items = [], cat = 'Усі', limit = PAGE, loadedAt = 0, updated = null, busy = false;
const saved = new Map(store.get('saved', []));
const read = new Set(store.get('read', []));
const lastVisit = store.get('visit', 0);
store.set('visit', Date.now());

const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };
const rtf = new Intl.RelativeTimeFormat('uk', { numeric: 'auto' });
function ago(d) {
  const m = Math.round((Date.parse(d) - Date.now()) / 60000);
  if (Math.abs(m) < 60) return rtf.format(m, 'minute');
  if (Math.abs(m) < 1440) return rtf.format(Math.round(m / 60), 'hour');
  return rtf.format(Math.round(m / 1440), 'day');
}
const web = u => typeof u === 'string' && /^https?:\/\//i.test(u);

async function load() {
  if (busy) return;
  busy = true; $('refresh').disabled = true; $('status').textContent = 'Оновлення…';
  try {
    const r = await fetch('data/news.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    items = data.items.filter(i => web(i.url)).sort((a, b) => Date.parse(b.date) - Date.parse(a.date));
    updated = data.updated; loadedAt = Date.now();
    fillSources(); fillCats(); health(data.status || []); render();
    busy = false; showStatus();
  } catch (e) {
    $('status').textContent = `Не вдалося оновити (${e.message}). Спробуємо ще раз за кілька хвилин.`;
    loadedAt = Date.now() - HOUR + 5 * 60e3;
    if (!items.length) render();
  } finally { busy = false; $('refresh').disabled = false; }
}
function showStatus() {
  if (!updated || busy) return;
  const left = Math.max(0, Math.ceil((loadedAt + HOUR - Date.now()) / 60000));
  $('status').textContent = `Дані ${ago(updated)} · перевірка через ${left} хв`;
}
function health(list) {
  $('health').replaceChildren(...list.map(s => el('p', { textContent: s.error ? `✗ ${s.name}: ${s.error}` : `✓ ${s.name}: ${s.count}` })));
}
function fillSources() {
  const cur = $('source').value;
  const names = [...new Set(items.map(i => i.source))].sort((a, b) => a.localeCompare(b, 'uk'));
  $('source').replaceChildren(new Option('Усі джерела', ''), ...names.map(n => new Option(n, n)));
  $('source').value = names.includes(cur) ? cur : '';
}
function fillCats() {
  const cats = ['Усі', '★ Збережене', ...new Set(items.map(i => i.cat))];
  $('cats').replaceChildren(...cats.map(c => {
    const b = el('button', { className: 'chip', textContent: c, onclick() { cat = c; limit = PAGE; fillCats(); render(); } });
    b.setAttribute('aria-pressed', c === cat);
    return b;
  }));
}
function card(i) {
  // у збереженому може лежати стара копія без перекладу
  const t = items.find(x => x.url === i.url) || i;
  const tr = uk && t.titleUk;
  const a = el('article', { className: read.has(i.url) ? 'read' : '' });
  if (web(i.image)) a.append(el('img', { src: i.image, alt: '', loading: 'lazy', referrerPolicy: 'no-referrer', onerror() { this.remove(); } }));
  const mark = () => { read.add(i.url); a.className = 'read'; store.set('read', [...read].slice(-3000)); };
  const link = el('a', { href: i.url, target: '_blank', rel: 'noopener noreferrer', textContent: tr ? t.titleUk : i.title, title: tr ? i.title : '', lang: tr ? 'uk' : '', onclick: mark, onauxclick: mark });
  const star = el('button', { className: 'star', onclick() {
    saved.has(i.url) ? saved.delete(i.url) : saved.set(i.url, i);
    store.set('saved', [...saved]); paint();
    if (cat === '★ Збережене') render();
  } });
  const paint = () => { const on = saved.has(i.url); star.textContent = on ? '★' : '☆'; star.setAttribute('aria-pressed', on); star.setAttribute('aria-label', on ? 'Прибрати зі збереженого' : 'Зберегти'); };
  paint();
  const meta = el('p', { className: 'meta' }, `${i.source} · ${ago(i.date)}${tr ? ' · автопереклад' : ''}`);
  if (lastVisit && Date.parse(i.date) > lastVisit) meta.append(el('span', { className: 'new', textContent: ' · нове' }));
  a.append(el('div', { className: 'body' }, meta, el('h2', {}, link), el('p', { className: 'meta', textContent: (tr ? t.textUk : i.text) || '' }),
    el('div', { className: 'foot' }, el('span', { className: 'meta', textContent: i.cat }), ...(i.cat === 'Українською' ? [] : [el('a', { className: 'meta full', target: '_blank', rel: 'noopener noreferrer', textContent: 'Стаття українською ↗', href: 'https://translate.google.com/translate?sl=auto&tl=uk&u=' + encodeURIComponent(i.url), onclick: mark })]), star)));
  return a;
}
function render() {
  const words = $('q').value.toLowerCase().split(/\s+/).filter(Boolean);
  const days = +$('period').value, src = $('source').value;
  let list = (cat === '★ Збережене' ? [...saved.values()] : items).filter(i =>
    (cat === 'Усі' || cat === '★ Збережене' || i.cat === cat) &&
    (!src || i.source === src) &&
    (!days || Date.now() - Date.parse(i.date) < days * 864e5) &&
    words.every(w => `${i.title} ${i.text} ${i.titleUk || ''} ${i.textUk || ''} ${i.source}`.toLowerCase().includes(w)));
  $('count').textContent = `Матеріалів: ${list.length}`;
  $('list').replaceChildren(...list.slice(0, limit).map(card));
  if (!list.length) $('list').append(el('p', { id: 'empty', className: 'meta', textContent: items.length || cat === '★ Збережене' ? 'Нічого не знайдено. Змініть фільтри або пошук.' : 'Новин ще немає. Якщо сервер щойно запущено, вони зʼявляться за кілька хвилин.' }));
  $('more').hidden = list.length <= limit;
}
['q','period','source'].forEach(id => $(id).addEventListener('input', () => { limit = PAGE; render(); }));
$('more').onclick = () => { limit += PAGE; render(); };
$('refresh').onclick = load;
const paintLang = () => { $('lang').setAttribute('aria-pressed', uk); $('lang').textContent = uk ? 'Показати оригінал' : 'Перекласти українською'; };
$('lang').onclick = () => { uk = !uk; store.set('uk', uk); paintLang(); render(); };
paintLang();
const setTheme = t => document.documentElement.dataset.theme = t;
setTheme(store.get('theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('theme').onclick = () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; setTheme(t); store.set('theme', t); };
// Перевірка щохвилини переживає сон комп'ютера. Поки даних немає, пробуємо частіше.
function tick() {
  const wait = items.length ? HOUR : 60e3;
  if (Date.now() - loadedAt >= wait) load(); else showStatus();
}
setInterval(tick, 60e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
// PWA: офлайн-режим і кнопка встановлення (Android, Chrome, Edge)
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
let prompt_;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); prompt_ = e; $('install').hidden = false; });
$('install').onclick = async () => { $('install').hidden = true; await prompt_?.prompt(); prompt_ = null; };
addEventListener('appinstalled', () => $('install').hidden = true);
fillCats(); load();
</script>
</body>
</html>
